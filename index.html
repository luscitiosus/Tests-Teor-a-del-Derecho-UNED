<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Test Teoría del Derecho (UNED)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Ibarra+Real+Nova:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');
:root{--paper:#f4ecd8;--paper2:#ebe0c3;--ink:#2b2118;--ink2:#5c4a38;--rule:#c9b68c;--wine:#7a2530;--gold:#a67c2e;--green:#3f5e3a;--navy:#2f3e52}
*{box-sizing:border-box}
body{margin:0;font-family:"Ibarra Real Nova","Palatino Linotype",Palatino,Georgia,serif;font-size:17px;background:#d9cba8 radial-gradient(circle at 50% 0,#e6dabb,#cdbd94);color:var(--ink);min-height:100vh;display:flex;justify-content:center;padding:10px}
.app{width:100%;max-width:1200px;height:calc(100vh - 20px);background:var(--paper);border:1px solid var(--gold);outline:1px solid var(--rule);outline-offset:-6px;border-radius:3px;box-shadow:0 12px 34px rgba(60,40,10,.3);display:flex;overflow:hidden}
aside{width:300px;flex-shrink:0;background:var(--paper2);border-right:1px double var(--gold);padding:20px 16px;display:flex;flex-direction:column;gap:11px}
aside h1{margin:0;font-size:27px;font-weight:700;color:var(--wine);letter-spacing:.3px;text-align:center;border-bottom:1px solid var(--gold);padding-bottom:6px}
aside .sub{font-size:14px;font-style:italic;color:var(--ink2);margin:6px 0 0;text-align:center}
label{font-size:13px;font-weight:600;color:var(--ink2);display:block;margin-bottom:3px;letter-spacing:.8px;text-transform:uppercase}
select{width:100%;padding:7px;border:1px solid var(--rule);border-radius:2px;font:inherit;font-size:16px;background:#faf4e4;color:var(--ink)}
.chk{display:flex;align-items:center;gap:6px;font-size:15px;margin:2px 0;text-transform:none;letter-spacing:0;font-weight:500}
.stats{display:flex;justify-content:space-between;font-size:14px;color:var(--ink2)}
.stats b{color:var(--wine)}
#grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:6px;background:#faf4e4;border:1px solid var(--rule);border-radius:2px;align-content:start;min-height:80px}
#grid button{aspect-ratio:1;border:1px solid var(--rule);border-radius:50%;background:#faf4e4;font:inherit;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink2)}
#grid button.ans{background:#e8dcb8;border-color:var(--gold);color:var(--ink)}
#grid button.ok{background:#d5dfc3;border-color:var(--green);color:var(--green)}
#grid button.bad{background:#ecc9c4;border-color:var(--wine);color:var(--wine)}
#grid button.cur{background:var(--wine);border-color:var(--wine);color:#f4ecd8}
.colophon{text-align:center;font-size:13px;color:var(--ink2);border-top:1px solid var(--rule);padding-top:8px;line-height:1.35}.colophon em{font-size:15px;color:var(--wine)}.colophon a{color:var(--navy)}
.btn{border:1px solid var(--ink2);border-radius:2px;padding:9px 16px;font:inherit;font-size:16px;font-weight:600;letter-spacing:.4px;cursor:pointer}
.btn.p{background:var(--wine);border-color:var(--wine);color:#f8f0dc}.btn.p:hover{background:#5e1a24}
.btn.s{background:transparent;color:var(--ink)}.btn.s:hover{background:var(--paper2)}
.btn.w{background:transparent;color:var(--gold);border-color:var(--gold)}
.btn:disabled{opacity:.4;cursor:not-allowed}
main{flex:1;display:flex;flex-direction:column;padding:28px 40px;overflow-y:auto}
header{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;margin-bottom:20px;border-bottom:3px double var(--gold);font-size:16px;gap:8px;flex-wrap:wrap}
.badge{background:transparent;color:var(--wine);font-size:14px;font-weight:600;font-style:italic;padding:2px 12px;border:1px solid var(--wine);border-radius:2px}
#timer{font-variant-numeric:tabular-nums;color:var(--ink2);font-weight:600}
.qwrap{max-width:780px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;justify-content:center}
#qtext{font-size:26px;font-weight:600;line-height:1.35;margin:0 0 24px;color:var(--ink)}
#qtext::first-letter{color:var(--wine);font-size:1.25em}
#opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;padding:13px 16px;border:1px solid var(--rule);border-left:4px solid var(--rule);border-radius:2px;background:#faf4e4;font:inherit;font-size:19px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;color:var(--ink)}
.opt:hover:not(:disabled){background:#f1e6c6;border-left-color:var(--gold)}
.opt .l{font-weight:700;color:var(--gold);font-style:italic}
.opt.sel{background:#efe2bd;border-color:var(--gold);border-left-color:var(--wine)}
.opt.ok{background:#e0e8cf;border-color:var(--green);border-left-color:var(--green);color:#26401f}
.opt.bad{background:#f2d6d1;border-color:var(--wine);border-left-color:var(--wine);color:#5e1a24}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.note{margin-top:14px;padding:12px 14px;border-radius:2px;background:#f7edc9;border:1px solid var(--gold);font-size:16px;font-style:italic;color:#5a4318}
.ref{margin-top:14px;padding:14px 18px;background:#fbf6e8;border:1px solid var(--gold);outline:1px solid var(--rule);outline-offset:-5px;border-radius:2px;color:var(--ink)}
.ref .rh{font-size:13px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--wine)}
.ref .rl{font-size:15px;font-weight:600;color:var(--navy);margin:3px 0 8px}
.ref .rx{font-size:17px;font-style:italic;line-height:1.5;border-left:3px solid var(--gold);padding-left:12px}
.ref .rw{margin-top:8px;font-size:14px;color:var(--wine)}
footer{max-width:780px;width:100%;margin:20px auto 0;padding-top:14px;border-top:3px double var(--gold);display:flex;justify-content:space-between;gap:8px}
#results{display:none;flex:1;overflow-y:auto;padding:28px;flex-direction:column;align-items:center}
.card{max-width:580px;width:100%;background:#faf4e4;border:1px solid var(--gold);outline:1px solid var(--rule);outline-offset:-6px;border-radius:2px;padding:30px;text-align:center}
.score{font-size:58px;font-weight:700;color:var(--wine);line-height:1}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.grid3 div{background:var(--paper);border:1px solid var(--rule);border-radius:2px;padding:10px;font-size:14px;color:var(--ink2)}
.grid3 strong{display:block;font-size:22px;margin-top:4px;color:var(--ink)}
.fails{text-align:left;margin-top:14px;font-size:15px}
.fails button{border:1px solid var(--wine);background:#f2d6d1;color:var(--wine);border-radius:2px;margin:2px;padding:3px 9px;cursor:pointer;font:inherit;font-weight:600}
.row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.row .btn{flex:1}
.hint{font-size:14px;color:var(--ink2);background:var(--paper2);border:1px solid var(--rule);border-radius:2px;padding:10px;margin-top:12px;text-align:left}
@media(max-width:860px){
 body{padding:0}.app{flex-direction:column;height:100vh;border-radius:0}
 aside{width:100%;border-right:0;border-bottom:3px double var(--gold);padding:10px;max-height:46vh;overflow-y:auto}
 #grid{grid-template-columns:repeat(10,1fr);flex:none;max-height:110px}
 main{padding:16px}#qtext{font-size:21px}.opt{font-size:17px}
}
</style>
</head>
<body>
<div class="app">
 <aside>
  <div><h1>Teoría del Derecho</h1><p class="sub">Test tipo UNED · <span id="rule"></span></p></div>
  <div><label for="exam">Convocatoria</label><select id="exam"></select></div>
  <div>
   <label for="mode">Modo</label>
   <select id="mode">
    <option value="exam">Examen (corrección al final)</option>
    <option value="study">Estudio (corrección inmediata)</option>
   </select>
  </div>
  <div>
   <label class="chk"><input type="checkbox" id="shQ"> Barajar preguntas</label>
   <label class="chk"><input type="checkbox" id="shO" checked> Barajar opciones</label>
  </div>
  <div class="stats"><span id="counter"></span><b id="answered"></b></div>
  <div id="grid"></div>
  <button class="btn p" id="finish">Finalizar y ver nota</button>
  <div class="colophon"><em>Hadrianus Muratellensis me fecit</em><br><a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.es" target="_blank" rel="license noopener">CC BY-NC-SA 4.0</a> · Los extractos del manual pertenecen a sus autores</div>
 </aside>

 <main id="quiz">
  <header>
   <span class="badge" id="badge"></span>
   <span id="timer">00:00</span>
   <span id="progress"></span>
  </header>
  <div class="qwrap">
   <h2 id="qtext"></h2>
   <div id="opts"></div>
   <div id="note" class="note" style="display:none"></div>
   <div id="ref" class="ref" style="display:none"></div>
  </div>
  <footer>
   <button class="btn s" id="prev">Anterior</button>
   <div style="display:flex;gap:8px">
    <button class="btn w" id="clear">Limpiar respuesta</button>
    <button class="btn p" id="next">Siguiente</button>
   </div>
  </footer>
 </main>

 <section id="results">
  <div class="card">
   <h2 style="margin:0 0 4px">Resultado</h2>
   <p style="margin:0 0 16px;font-size:13px;color:#5c4a38" id="rsub"></p>
   <div class="score" id="rscore">0,00</div>
   <p style="font-size:12px;color:#5c4a38;margin:6px 0 0" id="rmax"></p>
   <p style="font-size:15px;font-weight:600;margin:8px 0 0" id="rten"></p>
   <div class="grid3">
    <div>Aciertos (+0,5)<strong id="sc" style="color:#3f5e3a">0</strong></div>
    <div id="lerr">Errores<strong id="si" style="color:#7a2530">0</strong></div>
    <div>En blanco (0)<strong id="sb" style="color:#a67c2e">0</strong></div>
   </div>
   <div class="fails" id="fails"></div>
   <div class="hint" id="hist"></div>
   <div class="row">
    <button class="btn s" id="review">Revisar test</button>
    <button class="btn s" id="redo">Repasar falladas</button>
    <button class="btn p" id="restart">Reiniciar</button>
   </div>
  </div>
 </section>
</div>

<script>
/* =====================================================================

 ["De acuerdo con la teoría elaborada por el filósofo del derecho estadounidense Ronald Dworkin en su obra los derechos en serio:", ["El derecho no se compone sólo de reglas, sino también de principios éticos a los cuales hay que atender a la hora de establecer cuál es el derecho válido.", "El derecho se compone de dos tipos de normas: las normas de derecho positivo, es decir, las que provienen del legislador, y las normas de derecho natural, que bien proceden de un mandato divino, o bien de la propia naturaleza racional de los hombres.", "El derecho se compone exclusivamente del derecho creado por el legislador estatal, bien de forma directa, bien por delegación en otros agentes creadores de Derecho, que actúan siempre conforme a lo dispuesto por las leyes del Estado."], 0],
 ["La alteridad del Derecho es una característica que significa que", ["pone en referencia los actos de una persona con los de otra", "implica una alteración de las relaciones sociales", "afirma la posibilidad de que la relación jurídica se modifique"], 0],
 ["La norma social y la ley física se diferencian en que:", ["La norma social regula conductas y no constituye una descripción de la realidad.", "La ley física se sitúa en el plano del deber ser y la norma social en el plano del ser.", "La ley física prescribe las acciones de la naturaleza."], 0],

 ["La moral puede tener distintos significados:", ["como fuerza, apropiación y justificación", "Las dos respuestas anteriores son correctas.", "como el conjunto de hábitos, actos y carácter del ser humano"], 1],

 ["Cómo se denomina la cualidad que le falta al Derecho cuando los ciudadanos no cumplen las normas jurídicas:", ["Validez.", "Eficacia.", "Legitimidad."], 1],

sporlalegislaciónestatalointernacional":{"t":12,"s":"2.1. Derechos humanos y derechos fundamentales","p":211,"x":"«Según la opinión mayoritaria en la doctrina actual, se entiende que los derechos fundamentales son aquellos derechos humanos que han sido legalizados en los ordenamientos estatales o en la legislación internacional.»"},"quiénescribióelpensamientodeunderechoquenoseacoercitivoconstituiríaunabsurdo|lrecasenssiches":{"t":0,"s":"","p":0,"x":"","w":"No he localizado en el manual la frase sobre el Derecho que no sea coercitivo. El PDF marca a Recasens Siches (el manual cita a Recasens en T9 §2.3, p. 162, y a Del Vecchio en T1 §2.2, p. 41, pero no esa frase); contrástalo con tus apuntes."},"enquémétododeinterpretaciónelintérpretedebeatribuiralasnormasjurídicasunsentidoconformeconsusobjetivospropiossinperderdevistalosfinesgenerales|métodoteleológico":{"t":7,"s":"2.3. Diferentes métodos interpretativos","p":136,"x":"«Método teleológico o finalista. [...] El intérprete debe atribuir a las normas jurídicas un sentido y alcance siempre conforme con sus objetivos propios, sin perder nunca de vista los fines generales del sistema jurídico en su conjunto.»"},"enquétipodesistemasnormativoslasnormassededucenporrazóndesucontenido|enlossistemasnormativosestáticos":{"t":6,"s":"2.1. La unidad del ordenamiento jurídico","p":117,"x":"Kelsen distingue «sistemas de tipo estático, aquellos en los que las normas aparecen vinculadas por su contenido, de forma que a partir de una norma general y mediante sucesivas operaciones lógico-deductivas se establecen las restantes normas del sistema», y sistemas de tipo dinámico, donde la unidad se logra por el principio de jerarquía normativa."},"señalelarespuestacorrecta|elprocesodeargumentaciónjurídicaimplicalanecesidaddejustificarracionalmentelaspremisaspropiasdeladecisiónjudicial":{"t":7,"s":"3.2. Concepto de argumentación jurídica","p":143,"x":"La seguridad jurídica «ya no se va a derivar de la obligación de ajustarse a un proceso lógico-mecánico predeterminado por la ley, sino de la necesidad de justificar racionalmente las premisas de la decisión judicial conforme a criterios de racionalidad argumentativa»."},"lasnormasqueregulanlosincentivosparaunaempresaquecontrateapersonascondiscapacidadestáncumpliendolafuncióndelderechosiguiente|funciónpromocionaldelajusticia":{"t":9,"s":"2.5. La función promocional de la justicia","p":164,"x":"Como ejemplo de la función promocional se citan «las ayudas para las empresas que contraten a personas con discapacidad, para lograr la integración de este colectivo en riesgo de exclusión social»."},"lamoralpuedetenerdistintossignificados|lasdosrespuestassoncorrectas":{"t":1,"s":"2.1. La dimensión moral de la persona","p":36,"x":"El manual distingue varios sentidos de «moral»: como ánimo o fuerza («estar desmoralizado» indica falta de ánimo) y como estructura, en el sentido de «ajustamiento y consiguiente apropiación, esto es, hacer la propia vida a través de cada uno de nuestros actos»."},"elderechoaunmedioambienteadecuadoysaludableesunderechohumano|delatercerageneración":{"t":12,"s":"1.3. Derechos de tercera generación (los derechos de la solidaridad)","p":208,"x":"Entre los derechos de los pueblos, primer bloque de la tercera generación, figuran «el derecho de autodeterminación, el derecho al control de sus recursos naturales, [...] el derecho a la paz y el derecho a un medio ambiente saludable»."},"lateoríadelderechoes|aquellapartedelafilosofíadelderechoquetieneporobjetoelestudiodelserdelderecho":{"t":14,"s":"3.2. Principales ámbitos de proyección de la reflexión iusfilosófica (3.2.1. Teoría del Derecho)","p":258,"x":"«La Teoría del Derecho —también llamada en ocasiones Ontología jurídica— es aquella parte de la Filosofía jurídica que tiene por objeto el estudio del “ser” del Derecho, la determinación de un concepto unitario y global del mismo.»"},"elestudiosistemáticodelosderechoshumanosesunodeloscometidosde|laaxiologíajurídica":{"t":14,"s":"3.2. Principales ámbitos de proyección de la reflexión iusfilosófica (3.2.3. Axiología jurídica)","p":262,"x":"«Entre los cometidos de la Axiología Jurídica destaca singularmente en la actualidad el estudio sistemático de los derechos humanos, pues no en vano pretenden plasmar y proteger valores tan importantes como la libertad, la igualdad, la autonomía o la dignidad de la persona.»"},"dentrodelgrupodelasteoríasimperativistasencontramos|lateoríadehhartdistingueentrenormasprimariasqueestándirigidasalosciudadanosylasnormassecundariasqueconfierenpotestadesoderechostantoaparticularescomoalosfuncionarios":{"t":5,"s":"1.1.1. Tesis imperativistas","p":99,"x":"Hart distingue «las normas primarias, que están dirigidas a los ciudadanos exigiéndoles determinados comportamientos e imponiéndoles deberes, y las normas secundarias, que confieren potestades o derechos tanto a los particulares como a los funcionarios»."},"enrelaciónconlaeficaciadelainterpretaciónjurídicasepuededistinguirentre|interpretaciónpúblicaeinterpretaciónprivada":{"t":7,"s":"2.4. Tipos de interpretación","p":137,"x":"«En relación con la eficacia de la interpretación»: la interpretación privada, llevada a cabo por los ciudadanos, juristas o abogados, tiene «un carácter provisional y una eficacia limitada»; la interpretación pública es la realizada por los sujetos u órganos a los que el ordenamiento atribuye capacidad de imponer su resultado."},"loselementosqueconfiguranelderechosubjetivoson|elejerciciodelderechoylapretensión":{"t":4,"s":"2.2. Fundamento y contenido del derecho subjetivo","p":87,"x":"Las dos funciones del derecho subjetivo (facultad de reclamación y poder de exigir respeto) «determinan el contenido del derecho subjetivo, que se concreta en el ejercicio del derecho y su pretensión o defensa»."},"enquéfechaseproclamóladeclaraciónuniversaldelosderechoshumanos|el10dediciembrede1948":{"t":11,"s":"1. De los privilegios a los derechos humanos","p":190,"x":"«Se proclamó, el 10 de diciembre de 1948, la Declaración Universal de los Derechos Humanos.»"},"elmáximorepresentantedelhistoricismojurídicoes|friedrichcarlvansavigny":{"t":14,"s":"2.1. Distintas concepciones de la ciencia jurídica","p":248,"x":"El manual solo menciona de pasada «la Escuela histórica del Derecho» entre las corrientes de la ciencia jurídica del siglo XIX.","w":"El manual no desarrolla el historicismo jurídico ni nombra a Savigny como su máximo representante; la respuesta (Savigny) procede de la clave del PDF."},"señalelarespuestacorrecta|paraelpositivismolegalistadelsigloxixlaaplicaciónjudicialdelderechodebíalimitarseasubsumirloshechosbajolasnormasjurídicasgeneralesyabstractas":{"t":7,"s":"2.1. Concepto de interpretación jurídica","p":133,"x":"«Durante la mayor parte del siglo XIX y hasta bien entrado el siglo XX el positivismo legalista impuso una concepción de la actividad judicial como una labor meramente declarativa [...], limitándose a encajar o subsumir los hechos bajo el supuesto de una norma general y abstracta.»"},"lasnormasjurídicassecaracterizanpor|coercibilidadsanciónobjetivayexterioridad":{"t":1,"s":"1. Concepto de norma","p":34,"x":"Las normas jurídicas «regulan también conductas sociales y las imponen con carácter inexorablemente obligatorio. Sus caracteres son: la alteridad o bilateralidad, la exterioridad, la heteronomía y la coercibilidad objetiva o impositividad inexorable. Las sanciones vienen establecidas en las propias normas»."},"elnúcleodeladimensiónmoralradicaen|laconcienciaindividual":{"t":1,"s":"2.1. La dimensión moral de la persona","p":37,"x":"«La moral de la conciencia individual parte de la idea de bien, como algo valioso en sí, que el individuo se forja en su conciencia [...]. Así, el centro de gravedad de esta dimensión moral radica en la conciencia individual.»"},"lasrelacionesjurídicasestánreguladaspor|lasnormasjurídicas":{"t":3,"s":"4. La relación jurídica (y Resumen del tema)","p":64,"x":"«La relación jurídica es la relación intersubjetiva regulada por normas jurídicas. Sus elementos fundamentales son: a) sujetos; b) vínculo de atribución; c) objeto; d) norma jurídica.»"},"lasnormasdederechopúblicosonporlogeneral|preceptivasyexcluyenlospactosencontrario":{"t":4,"s":"1.4. Derecho público y Derecho privado","p":86,"x":"«Por lo general, las normas de Derecho Público son preceptivas y excluyen los pactos en contrario, mientras que las de Derecho privado son dispositivas, por lo que permiten, en uso de la autonomía de la voluntad, pacto en contrario.»"},"cuandoafirmamosquelosderechossubjetivospuedenserabsolutosorelativosestamoshaciendoreferenciaa|tiposdederechosubjetivoenrelaciónconelsujetopasivo":{"t":4,"s":"2.3. Diferentes tipos de derechos subjetivos (2.3.1. En relación con el sujeto pasivo)","p":88,"x":"«Atendiendo al sujeto pasivo, es decir, a aquel frente a quien se ejercita, pretende o defiende un derecho, los derechos pueden ser absolutos o relativos.»"},"algunosdelossiguientescaracteresnosonpropiosdeldeberjurídico|elejerciciodelderechoysupretensiónydefensa":{"t":4,"s":"2.2. Fundamento y contenido del derecho subjetivo","p":87,"x":"El contenido del derecho subjetivo «se concreta en el ejercicio del derecho y su pretensión o defensa»; es decir, son rasgos del derecho subjetivo y no del deber jurídico (que es el que establecen las normas jurídicas que obligan a realizar, o prohíben, determinadas conductas: apdo. 3.1, p. 90)."},"elsujetosocialllamadoaposeerelplenocontroldelaactividadcreadoradederechoes|elestado":{"t":4,"s":"1.1. Los sujetos sociales con capacidad para crear Derecho","p":81,"x":"El apartado enumera los sujetos creadores de Derecho: «el gobierno, el Parlamento y las administraciones públicas, las instituciones autonómicas y locales, las organizaciones internacionales y supranacionales, así como los sujetos individuales y los tribunales».","w":"No he localizado una frase que diga expresamente que el Estado tenga el pleno control de la actividad creadora; el manual subraya, más bien, que gobiernos y parlamentos estatales no tienen en exclusiva la potestad de crear Derecho. La clave marcada es «El Estado»."},"segúnpérezluñolasfuentesjurídicasmaterialesson|elconjuntodehechosquedeterminanlaexistenciadecadanormaenundeterminadoespacioytiempo":{"t":4,"s":"1.1. Los sujetos sociales con capacidad para crear Derecho","p":81,"x":"El manual solo habla de «distintas fuentes materiales y formales» al explicar el origen de la pluralidad de normas (Tema 5, apdo. 4, p. 106).","w":"No he encontrado la definición de Pérez-Luño sobre las fuentes materiales (puede estar en otro material de la asignatura). La clave del PDF dice «el conjunto de hechos que determinan la existencia de cada norma en un determinado espacio y tiempo»."},"dentrodelasfuncionesdelderechodestacan|ambasrespuestassoncorrectas":{"t":9,"s":"2. Principales funciones del Derecho","p":159,"x":"El tema estudia, entre otras, «la función de organización de la sociedad y de control social» (apdo. 2.2: integración y control) y «la función de legitimación y limitación de los poderes sociales» (apdo. 2.4); por eso ambas respuestas son correctas."},"algunosdelosmediosatravésdelosqueejerceelderecholafuncióndeintegraciónycontrolson|técnicasprotectorasyrepresivas":{"t":9,"s":"2.2. La función de organización de la sociedad y de control social","p":162,"x":"«Las técnicas “protectoras” y “represivas” son aquellas que tienden a imponer obligaciones o prohibiciones a los individuos bajo la amenaza de una pena o sanción.»"},"laconcepcióndeaustinsobrelanaturalezadelasnormasjurídicassuponequelasnormas|tienenunavalidezsubjetivaypsicológica":{"t":5,"s":"1.1.1. Tesis imperativistas","p":98,"x":"«La concepción austiniana de la norma como mandato impide que las normas tengan una validez normativa objetiva e independiente, pues plantea la necesidad de que exista una relación personal entre el mandante y el mandatario [...], lo que supone atribuir a las normas una validez subjetiva.»"},"segúnladoctrinakelsenianalanormaqueestableceelquematareaotroserácastigadocomoreodehomicidioconlapenadeprisiónde10a15añoses|unanormacompleta":{"t":5,"s":"1.1.2. Tesis antiimperativistas","p":100,"x":"Kelsen distingue «entre las normas completas, que poseen en sí mismas dicho carácter, y las denominadas normas incompletas que, al carecer de alguno de sus elementos esenciales, principalmente el carácter sancionador, han de ser puestas en relación con una norma completa». Ejemplo en el manual: el art. 138 CC pena (homicidio) establece la sanción."},"sidosnormasdeunmismoordenamientojurídicosoncontradictoriasperonocoincidetotalmentesuámbitodeaplicación|noexistiráantinomiajurídica":{"t":6,"s":"3. La coherencia del ordenamiento jurídico","p":123,"x":"Definición: antinomia es cuando, «afectando a un ámbito de validez jurídica idéntico, varias normas contienen prescripciones incompatibles». Pero el requisito b) dice que las normas han de tener, «total o parcialmente», el mismo ámbito de validez personal, material, espacial y temporal. El propio manual es ambiguo: la clave oficial (a) sigue la definición; el requisito b) apunta a que una coincidencia parcial bastaría.","w":"la clave oficial es la a), pero el requisito del manual («total o parcialmente») apunta a b); en el examen marca la a) y entiende por qué."},"elcriteriodejerarquíanormativasepuedeutilizarpara|dotardecoherenciaalordenamientojurídico":{"t":6,"s":"3. La coherencia del ordenamiento jurídico","p":122,"x":"«Otra cualidad que el ordenamiento jurídico ha de poseer es la de la coherencia, que se logrará cuando todas las normas que lo integran sean compatibles»; los criterios de jerarquía, cronología y especialidad sirven para resolver las antinomias (apdo. 3.1)."},"elmétododeinterpretaciónjurídicaqueanalizaelsentidoyalcancedelasnormasapartirdelascircunstanciaspolíticasjurídicasysocialesexistentesenelmomentodesupromulgaciónsedenomina|métodohistórico":{"t":7,"s":"2.3. Diferentes métodos interpretativos","p":136,"x":"«Método histórico. Pretende arrojar luz sobre el origen de una norma vigente con el objetivo de esclarecer su sentido a partir de las circunstancias políticas, jurídicas y sociales existentes en el momento de su promulgación.»"},"lainterpretaciónllevadaacaboporlosabogadosensulaborprofesionalsepuedeintegrarenlaclasedenominada|interpretaciónprivada":{"t":7,"s":"2.4. Tipos de interpretación","p":137,"x":"«Lo característico de la interpretación privada llevada a cabo por los ciudadanos (sean individuos particulares, juristas, abogados, etc.) es que está provista de un carácter provisional y una eficacia limitada.»"},"elactojurídico|esunaacciónhumanaconconsecuenciasjurídicas":{"t":3,"s":"3. Hechos y actos jurídicos","p":68,"x":"«Los actos jurídicos consisten en una acción o un comportamiento humano al que se atribuyen consecuencias jurídicas. [...] Los hechos jurídicos son acontecimientos puramente naturales, independientemente de toda acción humana, a los que el ordenamiento atribuye consecuencias jurídicas.»"},"marquelarespuestacorrectasobrelapazsocial|lapazsocialsolopuedeserfrutodelajusticiapuesencasocontrarionoseríamásquelaimplantacióndelainjusticia":{"t":10,"s":"1.1. Valores jurídicos colectivos","p":171,"x":"«Este valor (la paz social) sólo puede ser fruto de la Justicia; en caso contrario no sería más que la implantación de la injusticia.» Se distingue un sentido objetivo (sistema social y jurídico eficaz en realizar los valores para cuyo logro fue instituido) y un sentido subjetivo."},"ladogmáticajurídica|secentraenelanálisisysistematizacióndelcontenidomaterialdelasnormaspositivas":{"t":14,"s":"2.2. Principales manifestaciones de la ciencia jurídica (2.2.1. Dogmática jurídica)","p":250,"x":"«En términos generales, la Dogmática Jurídica se va a centrar en el estudio del Derecho vigente en un determinado territorio, más concretamente en el análisis sistemático del contenido material de las normas jurídicas dadas.»"},"lasnormasjurídicastienencomoprincipalobjetivoregular|conductasexternasdelosmiembrosdelgruposocial":{"t":1,"s":"2.2. Criterios de const TEMAS={"1": "Normas reguladoras de la conducta humana", "2": "Carácter pluridimensional del Derecho", "3": "Conceptos jurídicos fundamentales", "5": "Teoría de la norma jurídica", "6": "El ordenamiento jurídico", "7": "La interpretación", "9": "La eficacia social del Derecho", "10": "Los valores jurídicos. Justicia y Derecho", "11": "Los derechos humanos: concepto y fundamentación", "13": "Deontología de las profesiones jurídicas", "14": "El conocimiento jurídico"};
const NZ=s=>s.toLowerCase().replace(/[^a-z0-9áéíóúñ]/g,"");
const refOf=x=>REFS[NZ(x[0])+"|"+NZ(x[1][x[2]])]||null;
let S = null, timerId = null;

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function fmt(n){ return n.toFixed(2).replace(".", ","); }
function mmss(s){ const m=Math.floor(s/60), r=s%60; return String(m).padStart(2,"0")+":"+String(r).padStart(2,"0"); }

/* Construye la lista de preguntas de la convocatoria elegida.
   En «todas» se eliminan duplicados (misma pregunta y misma respuesta correcta). */
function buildPool(sel){
  if(sel !== "all") return EXAMS[+sel].qs.map(x => ({q:x[0], opts:x[1], ans:x[2], note:x[3]||"", ref:refOf(x), src:EXAMS[+sel].name}));
  const seen = new Set(), out = [];
  EXAMS.forEach(e => e.qs.forEach(x => {
    const nz = s => s.toLowerCase().replace(/[^a-z0-9áéíóúñ]/g, "");
    const key = nz(x[0]) + "|" + nz(x[1][x[2]]);
    if(seen.has(key)) return; seen.add(key);
    out.push({q:x[0], opts:x[1], ans:x[2], note:x[3]||"", ref:refOf(x), src:e.name});
  }));
  return out;
}

function prepare(pool){
  let items = $("shQ").checked ? shuffle(pool) : pool.slice();
  return items.map(it => {
    if(!$("shO").checked) return {...it};
    const order = shuffle(it.opts.map((_,i)=>i));
    return {...it, opts: order.map(i=>it.opts[i]), ans: order.indexOf(it.ans)};
  });
}

function start(poolOverride, modeOverride, penOverride){
  const sel = $("exam").value;
  if(modeOverride) $("mode").value = modeOverride;
  const pool = poolOverride || buildPool(sel);
  const pen = penOverride !== undefined ? penOverride : (sel === "all" ? DEFAULT_PEN : EXAMS[+sel].pen);
  S = { items: prepare(pool), answers: [], idx: 0, finished: false, t0: Date.now(), elapsed: 0, filter: sel, pen };
  $("rule").textContent = "aciertos +0,5 · errores " + (pen ? "−" + fmt(pen) : "no restan");
  $("results").style.display = "none";
  $("quiz").style.display = "flex";
  clearInterval(timerId);
  timerId = setInterval(() => { if(!S.finished){ S.elapsed = Math.floor((Date.now()-S.t0)/1000); $("timer").textContent = mmss(S.elapsed); } }, 1000);
  $("timer").textContent = "00:00";
  const label = sel === "all" ? "Todas las convocatorias (sin repetidas)" : "Convocatoria " + EXAMS[+sel].name;
  $("badge").textContent = (poolOverride ? "Repaso de falladas" : label);
  render();
}

function showFeedback(i){ // ¿se muestran aciertos/errores en esta pregunta?
  return S.finished || ($("mode").value === "study" && S.answers[i] !== undefined);
}

function render(){
  const it = S.items[S.idx], i = S.idx, fb = showFeedback(i);
  $("progress").textContent = "Pregunta " + (i+1) + " de " + S.items.length;
  $("qtext").textContent = (i+1) + ". " + it.q;
  const box = $("opts"); box.innerHTML = "";
  it.opts.forEach((t, k) => {
    const b = document.createElement("button");
    b.className = "opt";
    const l = document.createElement("span"); l.className = "l"; l.textContent = LET[k] + ")";
    const s = document.createElement("span"); s.textContent = t;
    b.append(l, s);
    const chosen = S.answers[i] === k;
    if(fb){
      b.disabled = true;
      if(k === it.ans){ b.classList.add("ok"); s.textContent = t + "  ✓"; }
      else if(chosen){ b.classList.add("bad"); s.textContent = t + "  ✗ (tu respuesta)"; }
      else b.classList.add("dim");
    } else {
      if(chosen) b.classList.add("sel");
      b.onclick = () => { S.answers[i] = k; render(); };
    }
    box.appendChild(b);
  });
  const n = $("note");
  if(fb && it.note){ n.style.display = "block"; n.textContent = it.note; } else n.style.display = "none";

  const rf = $("ref"), r = it.ref;
  if(fb && r){
    rf.style.display = "block"; rf.textContent = "";
    const mk=(c,t)=>{const d=document.createElement("div");d.className=c;d.textContent=t;rf.appendChild(d);};
    mk("rh","❦ En el manual");
    if(r.t) mk("rl","Tema "+r.t+(TEMAS[r.t]?". "+TEMAS[r.t]:"")+" · apdo. "+r.s+" · pág. ≈"+r.p);
    if(r.x) mk("rx",r.x);
    if(r.w) mk("rw","Aviso: "+r.w);
  } else rf.style.display = "none";

  $("prev").disabled = i === 0;
  $("clear").style.display = (S.finished || $("mode").value === "study") ? "none" : "";
  $("next").textContent = i === S.items.length-1 ? (S.finished ? "Ver resultado" : "Finalizar") : "Siguiente";
  renderGrid();
}

function renderGrid(){
  const g = $("grid"); g.innerHTML = "";
  S.items.forEach((it, i) => {
    const b = document.createElement("button");
    b.textContent = i+1;
    const a = S.answers[i];
    if(i === S.idx) b.className = "cur";
    else if(showFeedback(i) && a !== undefined) b.className = a === it.ans ? "ok" : "bad";
    else if(S.finished && a === undefined) b.className = "";
    else if(a !== undefined) b.className = "ans";
    b.onclick = () => { S.idx = i; render(); };
    g.appendChild(b);
  });
  $("counter").textContent = "Pregunta " + (S.idx+1) + " / " + S.items.length;
  $("answered").textContent = S.answers.filter(x => x !== undefined).length + " respondidas";
}

function finish(){
  if(S.finished){ showResults(); return; }
  const blank = S.items.length - S.answers.filter(x => x !== undefined).length;
  if(blank > 0 && !confirm("Tienes " + blank + " pregunta(s) en blanco. ¿Finalizar de todos modos?")) return;
  S.finished = true; S.elapsed = Math.floor((Date.now()-S.t0)/1000);
  clearInterval(timerId);
  showResults(true);
}

function showResults(save){
  let ok=0, ko=0, bl=0; const fails = [];
  S.items.forEach((it,i) => {
    const a = S.answers[i];
    if(a === undefined){ bl++; fails.push(i); }
    else if(a === it.ans) ok++;
    else { ko++; fails.push(i); }
  });
  const max = S.items.length * PTS_OK;
  const score = Math.max(0, ok*PTS_OK - ko*S.pen);
  const ten = max ? score / max * 10 : 0;
  $("rscore").textContent = fmt(score);
  $("rmax").textContent = "sobre " + fmt(max) + " puntos (" + S.items.length + " preguntas)";
  $("rten").textContent = "Nota sobre 10: " + fmt(ten);
  $("rsub").textContent = $("badge").textContent + " · tiempo " + mmss(S.elapsed);
  $("lerr").firstChild.textContent = "Errores (" + (S.pen ? "−" + fmt(S.pen) : "no restan") + ")";
  $("sc").textContent = ok; $("si").textContent = ko; $("sb").textContent = bl;

  const f = $("fails"); f.innerHTML = "";
  if(fails.length){
    const p = document.createElement("div"); p.textContent = "Falladas o en blanco (pulsa para revisar):"; p.style.marginBottom = "4px"; f.appendChild(p);
    fails.forEach(i => { const b = document.createElement("button"); b.textContent = i+1; b.onclick = () => goReview(i); f.appendChild(b); });
  } else f.textContent = "¡Sin fallos!";
  $("redo").style.display = fails.length ? "" : "none";
  S.fails = fails;

  // Historial local (si el navegador lo permite)
  let hist = [];
  try { hist = JSON.parse(localStorage.getItem("uned_td_hist") || "[]"); } catch(e){}
  if(save){
    hist.push({ exam: $("badge").textContent, ten: +ten.toFixed(2), date: new Date().toLocaleDateString("es-ES") });
    hist = hist.slice(-30);
    try { localStorage.setItem("uned_td_hist", JSON.stringify(hist)); } catch(e){}
  }
  const mine = hist.filter(h => h.exam === $("badge").textContent);
  $("hist").textContent = mine.length
    ? "Intentos en esta convocatoria: " + mine.length + " · mejor nota: " + fmt(Math.max(...mine.map(h=>h.ten))) + " · último: " + fmt(mine[mine.length-1].ten) + " (sobre 10)"
    : "Aún no hay historial para esta convocatoria.";

  $("quiz").style.display = "none";
  $("results").style.display = "flex";
}

function goReview(i){ $("results").style.display = "none"; $("quiz").style.display = "flex"; S.idx = i; render(); }

/* Eventos */
$("prev").onclick = () => { if(S.idx>0){ S.idx--; render(); } };
$("next").onclick = () => { if(S.idx < S.items.length-1){ S.idx++; render(); } else finish(); };
$("clear").onclick = () => { delete S.answers[S.idx]; render(); };
$("finish").onclick = finish;
$("review").onclick = () => goReview(0);
$("restart").onclick = () => start();
$("redo").onclick = () => {
  const pool = S.fails.map(i => { const it = S.items[i]; return {q:it.q, opts:it.opts, ans:it.ans, note:it.note, ref:it.ref, src:it.src}; });
  start(pool, "study", S.pen);
};
["exam","mode","shQ","shO"].forEach(id => $(id).onchange = () => start());
document.addEventListener("keydown", e => {
  if(!S || $("results").style.display === "flex" || e.target.tagName === "SELECT") return;
  if(e.key === "ArrowRight") $("next").click();
  else if(e.key === "ArrowLeft") $("prev").click();
  else if(["1","2","3","4","5"].includes(e.key) && !showFeedback(S.idx)){
    const k = +e.key - 1; if(k < S.items[S.idx].opts.length){ S.answers[S.idx] = k; render(); }
  }
});

/* Inicio */
(function init(){
  const sel = $("exam");
  const total = buildPool("all").length;
  sel.innerHTML = '<option value="all">Todas (' + total + ' preguntas únicas)</option>' +
    EXAMS.map((e,i) => '<option value="' + i + '">' + e.name + ' (' + e.qs.length + ')</option>').join("");
  start();
})();
</script>
</body>
</html>
